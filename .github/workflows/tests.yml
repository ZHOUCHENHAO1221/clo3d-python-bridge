name: tests

on:
  # Deliberately not filtered by branch name. This repository's default is `master`, a
  # `branches: [main]` filter meant the workflow never ran once, and a test suite that does not
  # run is worse than none - it reads as a green promise nobody is keeping.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The protocol half - loader, worker, results, heartbeats, timeouts, refusals - is the half
  # that can be tested anywhere. Running it on Linux as well as Windows is the point: if these
  # tests ever need a CLO, or a Windows API, they have stopped testing the contract and started
  # testing the UI.
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the offline suite
        run: python tests/test_offline.py
      - name: Run the mesh suite
        run: python tests/test_mesh.py
      - name: Run the lock suite
        run: python tests/test_lock.py

  # The map and the figures are generated, so a hand-edited one would drift from its source
  # silently - and a figure that disagrees with the code is worse than no figure.
  generated-files-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_api_map.py
      - run: python scripts/build_diagrams.py
      - name: Generated files must match their generators
        run: git diff --exit-code -- reference/API_MAP.md docs/
