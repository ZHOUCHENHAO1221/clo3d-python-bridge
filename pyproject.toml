[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clo3d-python-bridge"
version = "0.1.0"
description = "Drive CLO Standalone's Python API from an ordinary Python process"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Chenhao Zhou" }]
keywords = ["clo3d", "clo", "fashion", "simulation", "automation", "digital-fashion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = ["pywinauto>=0.6.8"]

[project.urls]
Homepage = "https://github.com/yourname/clo3d-python-bridge"
Issues = "https://github.com/yourname/clo3d-python-bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]
